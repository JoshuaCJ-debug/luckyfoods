<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#15803d" />
    <meta
      name="description"
      content="Lucky Foods - Online Food Ordering System"
    />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      body { font-family: 'Inter', sans-serif; }
      /* App-shell shown before React mounts — removed automatically once #root has children */
      #app-shell {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: #f9fafb;
        z-index: 9999;
      }
      #app-shell .brand {
        font-family: 'Archivo Black', 'Inter', sans-serif;
        letter-spacing: 0.02em;
        font-size: 1.75rem;
        color: #15803d;
      }
      #app-shell .spinner {
        width: 44px;
        height: 44px;
        border: 4px solid #dcfce7;
        border-top-color: #15803d;
        border-radius: 50%;
        animation: app-shell-spin 0.8s linear infinite;
      }
      @keyframes app-shell-spin { to { transform: rotate(360deg); } }
    </style>
    <title>Lucky Foods</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div id="app-shell">
        <div class="brand">LUCKY FOODS</div>
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
